name: Source verification

on:
  workflow_dispatch:
  push:
    branches:
      - develop/clearup-foundation

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Accessibility safety guard
        run: python3 scripts/verify_accessibility_safety.py
      - name: Storage safety guard
        run: python3 scripts/verify_storage_safety.py
      - name: Unit tests and Android lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --stacktrace
      - name: Analyze release R8 configuration
        run: ./gradlew :app:analyzeReleaseR8Config --stacktrace
