name: Publish signed release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: read
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(awk -F'"' '/^[[:space:]]*versionName = "/ { print $2; exit }' app/build.gradle.kts)"
          test -n "$VERSION"
          case "$VERSION" in
            *-dev|*-debug|*-alpha*|*-beta*|*-rc*)
              echo "Refusing to publish non-stable version: $VERSION" >&2
              exit 1
              ;;
          esac
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether release already exists
        id: existing
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v$VERSION already exists; signing and publishing are skipped."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report existing release artifacts
        if: steps.existing.outputs.exists == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK_NAME="ClearUp-$VERSION.apk"
          CHECKSUM_NAME="$APK_NAME.sha256"
          RELEASE_URL="$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json url --jq '.url')"
          ASSET_NAMES="$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          grep -Fxq "$APK_NAME" <<< "$ASSET_NAMES"
          grep -Fxq "$CHECKSUM_NAME" <<< "$ASSET_NAMES"

          SIGNING_ARTIFACT_ID="$(
            gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=ClearUp-$VERSION-signing-backup&per_page=100" \
              --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].id // empty'
          )"
          RELEASE_ARTIFACT_ID="$(
            gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=ClearUp-$VERSION-release-assets&per_page=100" \
              --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].id // empty'
          )"
          test -n "$SIGNING_ARTIFACT_ID"
          test -n "$RELEASE_ARTIFACT_ID"

          TITLE="ClearUp $VERSION release artifacts"
          BODY_FILE="$(mktemp)"
          cat > "$BODY_FILE" <<EOF
          ClearUp $VERSION is published and contains the required public assets.

          - Release: $RELEASE_URL
          - APK: $APK_NAME
          - Checksum: $CHECKSUM_NAME
          - Private signing-backup artifact ID: $SIGNING_ARTIFACT_ID
          - Verified release-assets artifact ID: $RELEASE_ARTIFACT_ID
          - Status-report workflow run ID: $GITHUB_RUN_ID

          The signing-backup artifact is private and expires after 90 days. Keep an offline copy. This issue contains no signing passwords or key material.
          EOF

          ISSUE_NUMBER="$(
            gh issue list --repo "$GITHUB_REPOSITORY" --state all \
              --search "$TITLE in:title" --json number,title \
              --jq ".[] | select(.title == \"$TITLE\") | .number" \
              | sed -n '1p'
          )"
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$BODY_FILE"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file "$BODY_FILE"
          fi

      - name: Accessibility safety guard
        if: steps.existing.outputs.exists != 'true'
        run: python3 scripts/verify_accessibility_safety.py

      - name: Storage safety guard
        if: steps.existing.outputs.exists != 'true'
        run: python3 scripts/verify_storage_safety.py

      - name: Compile, unit tests and Android lint
        if: steps.existing.outputs.exists != 'true'
        run: ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest :app:lintDebug --stacktrace

      - name: Analyze release R8 configuration
        if: steps.existing.outputs.exists != 'true'
        run: ./gradlew :app:analyzeReleaseR8Config --stacktrace

      - name: Restore production signing key
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signing
          ARTIFACT_LINE="$(
            gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.expired == false and (.name | startswith("ClearUp-")) and (.name | endswith("-signing-backup")))] | sort_by(.created_at) | reverse | .[0] | select(.) | [.created_at, (.id|tostring), .name] | @tsv'
          )"
          test -n "$ARTIFACT_LINE" || {
            echo "No non-expired ClearUp production signing backup exists. Refusing to generate a new key." >&2
            exit 1
          }
          SIGNING_ARTIFACT_ID="$(printf '%s' "$ARTIFACT_LINE" | cut -f2)"
          SIGNING_ARTIFACT_NAME="$(printf '%s' "$ARTIFACT_LINE" | cut -f3)"
          echo "Restoring production key from private artifact: $SIGNING_ARTIFACT_NAME"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SIGNING_ARTIFACT_ID/zip" > signing-backup.zip
          unzip -q signing-backup.zip -d signing-restored

          KEYSTORE_SOURCE="$(find signing-restored -type f -name 'ClearUp-release.jks' -print -quit)"
          CREDENTIALS_SOURCE="$(find signing-restored -type f -name 'credentials.txt' -print -quit)"
          test -f "$KEYSTORE_SOURCE"
          test -f "$CREDENTIALS_SOURCE"
          cp "$KEYSTORE_SOURCE" signing/ClearUp-release.jks
          cp "$CREDENTIALS_SOURCE" signing/credentials.txt

          STORE_PASSWORD="$(awk '/^Store password: / { sub(/^Store password: /, ""); print; exit }' signing/credentials.txt)"
          KEY_PASSWORD="$(awk '/^Key password: / { sub(/^Key password: /, ""); print; exit }' signing/credentials.txt)"
          KEY_ALIAS="$(awk '/^Key alias: / { sub(/^Key alias: /, ""); print; exit }' signing/credentials.txt)"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          echo "CLEARUP_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "CLEARUP_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "CLEARUP_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          chmod 600 signing/ClearUp-release.jks signing/credentials.txt

          keytool -list \
            -keystore signing/ClearUp-release.jks \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

      - name: Build signed release APK
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease --stacktrace \
            -Pclearup.release.storeFile="$GITHUB_WORKSPACE/signing/ClearUp-release.jks" \
            -Pclearup.release.storePassword="$CLEARUP_STORE_PASSWORD" \
            -Pclearup.release.keyAlias="$CLEARUP_KEY_ALIAS" \
            -Pclearup.release.keyPassword="$CLEARUP_KEY_PASSWORD"

      - name: Verify and package release assets
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$SOURCE_APK"
          APK_NAME="ClearUp-$VERSION.apk"
          mkdir -p dist
          cp "$SOURCE_APK" "dist/$APK_NAME"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"

          "$APKSIGNER" verify --verbose --print-certs "dist/$APK_NAME" | tee signing/certificate.txt
          "$AAPT" dump badging "dist/$APK_NAME" > signing/current-badging.txt
          PACKAGE_NAME="$(sed -n "s/package: name='\([^']*\)'.*/\1/p" signing/current-badging.txt | sed -n '1p')"
          test "$PACKAGE_NAME" = "com.norvexa.clearup"

          PREVIOUS_TAG="$(
            gh release list --repo "$GITHUB_REPOSITORY" --limit 20 --json tagName,isDraft,isPrerelease,publishedAt \
              --jq '[.[] | select(.isDraft == false and .isPrerelease == false)] | sort_by(.publishedAt) | reverse | .[0].tagName // empty'
          )"
          test -n "$PREVIOUS_TAG" || {
            echo "A previous production release is required to verify signing continuity." >&2
            exit 1
          }
          mkdir -p previous-release
          gh release download "$PREVIOUS_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir previous-release
          PREVIOUS_APK="$(find previous-release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -f "$PREVIOUS_APK"

          "$APKSIGNER" verify --print-certs "dist/$APK_NAME" > signing/current-cert.txt
          "$APKSIGNER" verify --print-certs "$PREVIOUS_APK" > signing/previous-cert.txt
          CURRENT_CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' signing/current-cert.txt | sed -n '1p')"
          PREVIOUS_CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' signing/previous-cert.txt | sed -n '1p')"
          test -n "$CURRENT_CERT"
          test -n "$PREVIOUS_CERT"
          test "$CURRENT_CERT" = "$PREVIOUS_CERT" || {
            echo "Signing certificate differs from $PREVIOUS_TAG. Refusing to publish an incompatible update." >&2
            exit 1
          }
          echo "Signing continuity verified against $PREVIOUS_TAG: $CURRENT_CERT"

          (
            cd dist
            sha256sum "$APK_NAME" > "$APK_NAME.sha256"
          )
          test -s "dist/$APK_NAME.sha256"

      - name: Upload private signing backup
        if: steps.existing.outputs.exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ClearUp-${{ steps.version.outputs.version }}-signing-backup
          path: signing/
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Upload verified release assets
        if: steps.existing.outputs.exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ClearUp-${{ steps.version.outputs.version }}-release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Publish GitHub Release
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK_NAME="ClearUp-$VERSION.apk"
          gh release create "v$VERSION" \
            "dist/$APK_NAME" \
            "dist/$APK_NAME.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ClearUp $VERSION" \
            --notes-file CHANGELOG.md
